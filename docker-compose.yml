version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: lpms_db
    environment:
      POSTGRES_USER: lpms_user
      POSTGRES_PASSWORD: lpms_password
      POSTGRES_DB: lpms
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lpms_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  db_data:
